name: Update Static Tamil Calendar Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and translate English calendar data
        run: node scripts/update-calendar.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture Tamil calendar crop and generate static Tamil page
        run: node scripts/capture-tamil-page.mjs

      - name: Generate fully static English page
        run: node scripts/render-english-static.mjs

      - name: Save updated static calendar pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/calendar.json \
            tamil-calendar.png \
            index.html \
            English.html

          git diff --cached --quiet || git commit -m "Update static Tamil calendar pages"
          git push
