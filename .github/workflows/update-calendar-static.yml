name: Update Static Tamil Calendar Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and translate calendar data
        run: node scripts/update-calendar.mjs

      - name: Generate fully static Tamil and English pages
        run: node scripts/render-static-pages.mjs

      - name: Save updated calendar data and static pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json data/calendar-tamil.json index.html English.html
          git diff --cached --quiet || git commit -m "Update static Tamil calendar pages"
          git push
